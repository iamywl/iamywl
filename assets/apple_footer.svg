<svg width="850" height="90" viewBox="0 0 850 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="brightFooterLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0" />
      <stop offset="25%" stop-color="#BFDBFE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#BFDBFE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Capsule Gradient -->
    <linearGradient id="brightFooterPillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <style>
      @keyframes footerGlowBright {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .footer-glowing-line {
        animation: footerGlowBright 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Separator Line -->
  <line class="footer-glowing-line" x1="80" y1="12" x2="770" y2="12" stroke="url(#brightFooterLine)" stroke-width="1.2" />

  <!-- Center Capsule -->
  <g transform="translate(425, 48)" text-anchor="middle">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="url(#brightFooterPillBg)" stroke="#E2E8F0" stroke-width="1" />
    <text y="-2" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#0F172A" letter-spacing="0.03em">
       visionOS Spatial Glassmorphism × Toss TDS · <tspan fill="#2563EB" font-weight="700">@iamywl</tspan>
    </text>
    <text y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="400" fill="#64748B" letter-spacing="0.02em">
      Production Telemetry · Verified Benchmarks · 100% Anonymized Engineering Profile · © 2026
    </text>
  </g>
</svg>