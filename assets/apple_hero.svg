<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#2997FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Apple Titanium Border Gradient -->
    <linearGradient id="titaniumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Chip Background -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="238" rx="18" fill="url(#bgGrad)" stroke="url(#titaniumBorder)" stroke-width="1.5" />
  <rect x="1" y="1" width="848" height="238" rx="18" fill="url(#ambientGlow)" />

  <!-- Apple Brand Mark & Overline -->
  <g transform="translate(425, 42)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.2em" fill="#2997FF">
       INFRASTRUCTURE &amp; SECURITY ARCHITECTURE
    </text>
  </g>

  <!-- Main Headline: YOONWOO LEE -->
  <g transform="translate(425, 96)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em" fill="url(#textGrad)">
      Yoonwoo Lee
    </text>
  </g>

  <!-- Subheadline: Systems & Cloud Native -->
  <g transform="translate(425, 134)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="15" font-weight="500" letter-spacing="-0.01em" fill="#94A3B8">
      Systems &amp; Cloud Native Specialist · M.S. in Computer Science @ KNU
    </text>
  </g>

  <!-- Apple Keynote Feature Pill Chips -->
  <g transform="translate(425, 185)" text-anchor="middle">
    <!-- Chip 1: eBPF & Kernel -->
    <g transform="translate(-240, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#chipBg)" stroke="#334155" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🛡️ eBPF &amp; Kernel Tracing
      </text>
    </g>

    <!-- Chip 2: Cloud Native K8s -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#chipBg)" stroke="#334155" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ☁️ Cloud Native &amp; K8s
      </text>
    </g>

    <!-- Chip 3: High-Perf Systems -->
    <g transform="translate(240, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#chipBg)" stroke="#334155" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ⚡ Algorithmic Architecture
      </text>
    </g>
  </g>
</svg>