<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Background Gradient -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#030509" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- visionOS Specular Rim Gradient (135°) -->
    <linearGradient id="outerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#3182F6" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Sub-card Glass Background -->
    <linearGradient id="subCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#090E17" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="subCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Tech Pill Background -->
    <linearGradient id="techPillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="matrixSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="matrixClip">
      <rect x="1" y="1" width="848" height="378" rx="24" />
    </clipPath>

    <style>
      @keyframes matrixSheenSweep {
        0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
        20% { opacity: 0.5; }
        55% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
        100% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
      }
      .matrix-sheen {
        animation: matrixSheenSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Container Unibody -->
  <rect x="1" y="1" width="848" height="378" rx="24" fill="url(#matrixBg)" stroke="url(#outerRim)" stroke-width="1.2" />

  <!-- Sheen Sweep -->
  <g clip-path="url(#matrixClip)">
    <rect class="matrix-sheen" x="0" y="0" width="180" height="380" fill="url(#matrixSheen)" />
  </g>

  <!-- ================= SUB-CARD 1: KERNEL & RUNTIME SECURITY (Top-Left) ================= -->
  <g transform="translate(18, 18)">
    <rect width="398" height="164" rx="16" fill="url(#subCardBg)" stroke="url(#subCardBorder)" stroke-width="1" />
    
    <!-- Header & Subtitle -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em" fill="#38BDF8">
      🛡️ KERNEL &amp; RUNTIME SECURITY
    </text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11" font-weight="400" fill="#64748B">
      eBPF Syscall Tracing · Kernel Exploit Mitigation
    </text>

    <!-- Pills Row 1 -->
    <g transform="translate(20, 68)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="124" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="62" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Linux Kernel 6.x</text>

      <!-- Pill 2 -->
      <rect x="132" y="0" width="112" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="188" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">eBPF (libbpf)</text>

      <!-- Pill 3 -->
      <rect x="252" y="0" width="104" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="304" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Syscall Audit</text>
    </g>

    <!-- Pills Row 2 -->
