      <text x="308" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Cilium CNI</text>
    </g>
  </g>

