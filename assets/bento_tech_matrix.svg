      <!-- Pill 4 -->
      <rect x="0" y="0" width="136" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Zero-Trust Gating</text>

      <!-- Pill 5 -->
      <rect x="144" y="0" width="108" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="198" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Falco Runtime</text>

      <!-- Pill 6 -->
