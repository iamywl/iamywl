      <rect x="106" width="76" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="144" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Trivy</text>
      <rect x="190" width="76" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="228" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Falco</text>
      <rect x="274" width="88" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="318" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Kyverno</text>
