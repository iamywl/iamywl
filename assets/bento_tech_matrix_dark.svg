      <rect x="208" width="76" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="246" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Docker</text>
      <rect x="292" width="70" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="327" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Helm</text>
    </g>
    <!-- Row 2 Pills -->
    <g transform="translate(18, 99)">
      <rect width="86" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="43" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">ArgoCD</text>
      <rect x="94" width="94" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="141" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">MetalLB L2</text>
      <rect x="196" width="94" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="243" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Cilium CNI</text>
      <rect x="298" width="64" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="330" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">HPA</text>
