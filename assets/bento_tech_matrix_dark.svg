    <!-- Row 2 Pills -->
    <g transform="translate(18, 99)">
      <rect width="124" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="62" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">HashiCorp Vault</text>
      <rect x="132" width="94" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="179" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Cloud-Init</text>
      <rect x="234" width="84" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="276" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Ansible</text>
    </g>
    <text x="18" y="146" font-family="Pretendard" font-size="10.5" font-weight="600" fill="#A78BFA">🔒 100% Automated Critical CVE Gating &amp; Zero-Root Enforcement</text>
  </g>

  <!-- Sub-Card 4: Observability & High-Scale Backend -->
  <g transform="translate(434, 198)" filter="url(#subCardShadowDark)">
    <rect width="398" height="164" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1" />
