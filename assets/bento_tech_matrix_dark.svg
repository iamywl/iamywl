      <rect x="106" width="72" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="142" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">Kafka</text>
      <rect x="186" width="108" height="25" rx="7" fill="#21262D" stroke="#30363D" /><text x="240" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#C9D1D9" text-anchor="middle">OpenTelemetry</text>
    </g>
    <text x="18" y="146" font-family="Pretendard" font-size="10.5" font-weight="600" fill="#2DD4BF">⚡ 10k+ Concurrency &amp; 94%+ Redis Hit Ratio under Traffic Spikes</text>
  </g>
</svg>
