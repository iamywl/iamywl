      <rect width="86" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="43" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">ArgoCD</text>
      <rect x="94" width="94" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="141" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">MetalLB L2</text>
      <rect x="196" width="94" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="243" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Cilium CNI</text>
      <rect x="298" width="64" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="330" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">HPA</text>
