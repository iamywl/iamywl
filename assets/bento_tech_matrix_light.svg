<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Ceramic White) -->
    <linearGradient id="bentoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Sub-card Soft Shadow -->
    <filter id="subCardShadowLight" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#bentoBgLight)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Sub-Card 1: Kernel & Systems Performance -->
  <g transform="translate(18, 18)" filter="url(#subCardShadowLight)">
    <rect width="398" height="164" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="18" cy="28" r="3.5" fill="#2563EB" />
    <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="800" letter-spacing="0.04em" fill="#1D4ED8">
      KERNEL &amp; SYSTEMS PERFORMANCE
    </text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="500" fill="#64748B">
      eBPF Syscall Tracing · Kernel Exploit Mitigation
    </text>
    <!-- Row 1 Pills -->
    <g transform="translate(18, 66)">
      <rect width="84" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="42" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Linux 6.x</text>
      <rect x="92" width="98" height="25" rx="7" fill="#EFF6FF" stroke="#BFDBFE" /><text x="141" y="17" font-family="Pretendard" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">eBPF / BCC</text>
      <rect x="198" width="84" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="240" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">C / C++</text>
      <rect x="290" width="72" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="326" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Go</text>
    </g>
    <!-- Row 2 Pills -->
    <g transform="translate(18, 99)">
      <rect width="104" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="52" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">epoll WAS</text>
      <rect x="112" width="126" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="175" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Tracepoints / XDP</text>
      <rect x="246" width="116" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="304" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Ring Buffer</text>
    </g>
    <text x="18" y="146" font-family="Pretendard" font-size="10.5" font-weight="600" fill="#059669">⚡ Target: &lt; 1.2μs hook latency &amp; 100k+ pkts/s line-rate</text>
  </g>

