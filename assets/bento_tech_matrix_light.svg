      <rect x="132" width="94" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="179" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Cloud-Init</text>
      <rect x="234" width="84" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="276" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Ansible</text>
    </g>
    <text x="18" y="146" font-family="Pretendard" font-size="10.5" font-weight="600" fill="#4338CA">🔒 100% Automated Critical CVE Gating &amp; Zero-Root Enforcement</text>
  </g>

