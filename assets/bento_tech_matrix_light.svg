      <rect x="106" width="72" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="142" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Kafka</text>
      <rect x="186" width="108" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="240" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">OpenTelemetry</text>
    </g>
    <text x="18" y="146" font-family="Pretendard" font-size="10.5" font-weight="600" fill="#0D9488">⚡ 10k+ Concurrency &amp; 94%+ Redis Hit Ratio under Traffic Spikes</text>
  </g>
</svg>
