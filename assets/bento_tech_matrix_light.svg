      <rect x="112" width="76" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="150" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Grafana</text>
      <rect x="196" width="94" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="243" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Redis Cache</text>
      <rect x="298" width="74" height="25" rx="7" fill="#F8FAFC" stroke="#E2E8F0" /><text x="335" y="17" font-family="Pretendard" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">PostgreSQL</text>
