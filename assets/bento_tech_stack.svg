<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#030408" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Outer Titanium Border -->
    <linearGradient id="outerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#3182F6" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <!-- Sub-card Border -->
    <linearGradient id="subBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <!-- Sub-card Background -->
    <linearGradient id="subCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#090E17" stop-opacity="0.7" />
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="techPillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Container Box with 24px Radius -->
  <rect x="1" y="1" width="848" height="358" rx="24" fill="url(#bgGrad)" stroke="url(#outerBorder)" stroke-width="1.2" />

  <!-- ================= SUB-CARD 1: KERNEL & SECURITY (Top-Left) ================= -->
  <g transform="translate(18, 18)">
    <rect width="398" height="154" rx="16" fill="url(#subCardBg)" stroke="url(#subBorder)" stroke-width="1" />
    <!-- Header -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#38BDF8">
      🛡️ KERNEL &amp; RUNTIME SECURITY
    </text>
    <!-- Pills Row 1 -->
    <g transform="translate(20, 52)">
      <!-- Pill: Linux Kernel 6.x -->
      <rect x="0" y="0" width="124" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="62" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Linux Kernel 6.x</text>

      <!-- Pill: eBPF Tracing -->
      <rect x="132" y="0" width="108" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="186" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">eBPF Tracing</text>

      <!-- Pill: Syscall Audit -->
      <rect x="248" y="0" width="108" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="302" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Syscall Audit</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(20, 90)">
      <!-- Pill: Zero-Trust Defense -->
      <rect x="0" y="0" width="138" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="69" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Zero-Trust Defense</text>

      <!-- Pill: Trivy SecOps -->
      <rect x="146" y="0" width="102" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="197" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Trivy SecOps</text>

      <!-- Pill: Cilium CNI -->
      <rect x="256" y="0" width="96" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="304" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Cilium CNI</text>
    </g>
  </g>

  <!-- ================= SUB-CARD 2: CLOUD NATIVE & IAC (Top-Right) ================= -->
  <g transform="translate(434, 18)">
    <rect width="398" height="154" rx="16" fill="url(#subCardBg)" stroke="url(#subBorder)" stroke-width="1" />
    <!-- Header -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#60A5FA">
      ☁️ CLOUD NATIVE &amp; INFRASTRUCTURE
    </text>
    <!-- Pills Row 1 -->
    <g transform="translate(20, 52)">
      <!-- Pill: Kubernetes Multi-Cluster -->
      <rect x="0" y="0" width="158" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="79" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Multi-Cluster K8s</text>

      <!-- Pill: Docker Container -->
      <rect x="166" y="0" width="108" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="220" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Docker Core</text>

      <!-- Pill: Helm v3 -->
      <rect x="282" y="0" width="76" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="320" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Helm v3</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(20, 90)">
      <!-- Pill: Terraform Declarative IaC -->
      <rect x="0" y="0" width="168" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="84" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Terraform IaC</text>

      <!-- Pill: Tart Virtualization -->
      <rect x="176" y="0" width="118" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="235" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Tart VM</text>

      <!-- Pill: Actions CI/CD -->
      <rect x="302" y="0" width="62" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="333" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">CI/CD</text>
    </g>
  </g>

  <!-- ================= SUB-CARD 3: OBSERVABILITY & PLATFORM (Bottom-Left) ================= -->
  <g transform="translate(18, 188)">
    <rect width="398" height="154" rx="16" fill="url(#subCardBg)" stroke="url(#subBorder)" stroke-width="1" />
    <!-- Header -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#34D399">
      📈 OBSERVABILITY &amp; PLATFORM TELEMETRY
    </text>
    <!-- Pills Row 1 -->
    <g transform="translate(20, 52)">
      <!-- Pill: Prometheus Metrics -->
      <rect x="0" y="0" width="138" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="69" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Prometheus Metrics</text>

      <!-- Pill: Grafana Dashboards -->
      <rect x="146" y="0" width="134" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="213" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Grafana Telemetry</text>

      <!-- Pill: OpenTelemetry -->
      <rect x="288" y="0" width="76" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="326" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">OTel APM</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(20, 90)">
      <!-- Pill: High Availability (99.99%) -->
      <rect x="0" y="0" width="148" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="74" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">High Availability (HA)</text>

      <!-- Pill: APM Bottleneck Tuning -->
      <rect x="156" y="0" width="144" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="228" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">APM Tuning</text>

      <!-- Pill: Nginx/Tomcat -->
      <rect x="308" y="0" width="60" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="338" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">WAS</text>
    </g>
  </g>

  <!-- ================= SUB-CARD 4: SYSTEMS & ALGORITHMS (Bottom-Right) ================= -->
  <g transform="translate(434, 188)">
    <rect width="398" height="154" rx="16" fill="url(#subCardBg)" stroke="url(#subBorder)" stroke-width="1" />
    <!-- Header -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#F472B6">
      ⚡ SYSTEMS &amp; ALGORITHMS
    </text>
    <!-- Pills Row 1 -->
    <g transform="translate(20, 52)">
      <!-- Pill: Samsung B-Type Pro -->
      <rect x="0" y="0" width="156" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="78" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Samsung B-Type Pro</text>

      <!-- Pill: C / Modern C++17 -->
      <rect x="164" y="0" width="114" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="221" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">C / C++17</text>

      <!-- Pill: Go 1.22 -->
      <rect x="286" y="0" width="76" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="324" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Go 1.22</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(20, 90)">
      <!-- Pill: Python 3.12 -->
      <rect x="0" y="0" width="94" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="47" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Python 3.12</text>

      <!-- Pill: Java 17+ -->
      <rect x="102" y="0" width="82" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="143" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Java 17+</text>

      <!-- Pill: POSIX Bash -->
      <rect x="192" y="0" width="90" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="237" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">POSIX Bash</text>

      <!-- Pill: 7x Hackathon Awards -->
      <rect x="290" y="0" width="76" height="26" rx="8" fill="url(#techPillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="328" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">7x Awards</text>
    </g>
  </g>
</svg>
