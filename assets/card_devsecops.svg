<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180D1E" />
      <stop offset="55%" stop-color="#0F0814" />
      <stop offset="100%" stop-color="#060308" />
    </linearGradient>

    <!-- visionOS Specular Rim Gradient (135°) -->
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#EC4899" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Ambient Glow: Rose / Violet Accent -->
    <radialGradient id="cardGlow4" cx="88%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Telemetry Box Background -->
    <linearGradient id="telemBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="telemBorder4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.20" />
    </linearGradient>

    <!-- Stack Pill Background -->
    <linearGradient id="pillBg4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="sheen4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip4">
      <rect x="1" y="1" width="413" height="238" rx="20" />
    </clipPath>

    <style>
      @keyframes cardSheen4 {
        0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
        25% { opacity: 0.6; }
        60% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
        100% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
      }
      @keyframes telemPulse4 {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(244, 114, 182, 0.25)); }
        50% { filter: drop-shadow(0 0 7px rgba(236, 72, 153, 0.55)); }
      }
      .card-sheen-sweep4 {
        animation: cardSheen4 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .telem-box4 {
        animation: telemPulse4 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Unibody Card Canvas -->
  <rect x="1" y="1" width="413" height="238" rx="20" fill="url(#bgGrad4)" stroke="url(#borderGrad4)" stroke-width="1.2" />
  <rect x="1" y="1" width="413" height="238" rx="20" fill="url(#cardGlow4)" />

  <!-- Sheen Sweep -->
  <g clip-path="url(#cardClip4)">
    <rect class="card-sheen-sweep4" x="0" y="0" width="120" height="240" fill="url(#sheen4)" />
  </g>

  <!-- Top Domain Pill -->
  <g transform="translate(20, 20)">
    <rect width="170" height="22" rx="11" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="85" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#F472B6" text-anchor="middle">
      🔒 ZERO-TRUST GITOPS
    </text>
  </g>

  <!-- Repository Action Arrow Link -->
  <g transform="translate(367, 18)">
    <circle cx="14" cy="14" r="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8" />
    <path d="M10 18L18 10M18 10H12M18 10V16" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title: devsecops -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
    devsecops
  </text>

  <!-- Subtitle -->
  <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="12" font-weight="600" letter-spacing="-0.01em" fill="#F472B6">
    4-Cluster Homelab &amp; GitOps Security Platform
  </text>

  <!-- Architecture Highlights -->
  <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
    • Dev / Staging / Prod / Ops strict segregated topology
  </text>
  <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
    • Trivy shift-left image gating &amp; Kyverno zero-root policy
  </text>

  <!-- Dedicated Telemetry Glass Box -->
  <g class="telem-box4" transform="translate(20, 148)">
    <rect width="375" height="32" rx="8" fill="url(#telemBg4)" stroke="url(#telemBorder4)" stroke-width="1" />
    <!-- Metric 1 -->
    <text x="14" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">
      🔒 CVE GATING: <tspan fill="#F472B6" font-weight="800">100% Trivy Block</tspan>
    </text>
    <line x1="184" y1="8" x2="184" y2="24" stroke="#334155" stroke-width="1" />
    <!-- Metric 2 -->
    <text x="196" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">
      🛡️ RUNTIME: <tspan fill="#34D399" font-weight="800">Falco Kernel Defense</tspan>
    </text>
  </g>

  <!-- Bottom Tech Stack Chips -->
  <g transform="translate(20, 196)">
    <!-- Pill 1: DevSecOps -->
    <g transform="translate(0, 0)">
      <rect width="84" height="24" rx="7" fill="url(#pillBg4)" stroke="#334155" stroke-width="0.8" />
      <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">DevSecOps</text>
    </g>
    <!-- Pill 2: Trivy -->
    <g transform="translate(92, 0)">
      <rect width="60" height="24" rx="7" fill="url(#pillBg4)" stroke="#334155" stroke-width="0.8" />
      <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Trivy</text>
    </g>
    <!-- Pill 3: Falco -->
    <g transform="translate(160, 0)">
      <rect width="60" height="24" rx="7" fill="url(#pillBg4)" stroke="#334155" stroke-width="0.8" />
      <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Falco</text>
    </g>
    <!-- Pill 4: Kyverno / Vault -->
    <g transform="translate(228, 0)">
      <rect width="112" height="24" rx="7" fill="url(#pillBg4)" stroke="#334155" stroke-width="0.8" />
      <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Kyverno / Vault</text>
    </g>
  </g>
</svg>
