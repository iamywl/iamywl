<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft White Ceramic Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Hairline Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="411" height="236" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardShadow)" />

  <!-- Top Badge -->
  <g transform="translate(20, 18)">
    <rect width="162.4" height="24" rx="12" fill="#EEF2FF" stroke="#E0E7FF" stroke-width="1" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.04em" fill="#4F46E5">
      🔒 ZERO-TRUST GITOPS
    </text>
  </g>

  <!-- Arrow Link Button -->
  <g transform="translate(365, 18)">
    <circle cx="15" cy="12" r="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <path d="M12 9l6 0m0 0l0 6m0-6l-7 7" stroke="#3182F6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.025em" fill="#0F172A">
    devsecops
  </text>

  <!-- Domain Subtitle (Toss Blue) -->
  <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#2563EB">
    4-Cluster Homelab &amp; GitOps Security Platform
  </text>

  <!-- Bullet Points (Slate) -->
  <text x="20" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#334155">
    • Dev / Staging / Prod / Ops strict segregated topology
  </text>
  <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#334155">
    • Trivy shift-left image gating &amp; Kyverno zero-root policy
  </text>

  <!-- Clean Telemetry Box -->
  <g transform="translate(20, 148)">
    <rect width="375" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">🔒 CVE GATING: <tspan fill="#2563EB" font-weight="700">100% Trivy Block</tspan> &#160;&#160;|&#160;&#160; 🛡️ DEFENSE: <tspan fill="#059669" font-weight="700">Falco Runtime</tspan></text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(0, 192)">
    
        <g transform="translate(20, 0)">
          <rect width="91.5" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="45.75" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">DevSecOps</text>
        </g>
        <g transform="translate(119.5, 0)">
          <rect width="61.5" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="30.75" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Trivy</text>
        </g>
        <g transform="translate(189.0, 0)">
          <rect width="61.5" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="30.75" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Falco</text>
        </g>
        <g transform="translate(258.5, 0)">
          <rect width="136.5" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="68.25" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Kyverno / Vault</text>
        </g>
  </g>
</svg>