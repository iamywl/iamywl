<svg width="415" height="230" viewBox="0 0 415 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Ambient Glow: Emerald Neon -->
    <radialGradient id="cardGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#30D158" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Delicate Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#30D158" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Card Base with Soft 20px TDS Radius -->
  <rect x="1" y="1" width="413" height="228" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="413" height="228" rx="20" fill="url(#cardGlow)" />

  <!-- Top Domain Pill & Action Icon -->
  <g transform="translate(24, 24)">
    <rect width="188" height="22" rx="11" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="94" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.1em" fill="#30D158" text-anchor="middle">
      🔒 DEVSECOPS HOMELAB
    </text>
  </g>

  <!-- Repository Action Arrow -->
  <g transform="translate(372, 28)">
    <circle cx="10" cy="10" r="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
    <path d="M7 13L13 7M13 7H8.5M13 7V11.5" stroke="#8B95A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title: Project Name -->
  <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="21" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
    devsecops
  </text>

  <!-- English Description -->
  <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="12.5" font-weight="600" letter-spacing="-0.01em" fill="#4ADE80">
    Enterprise DevSecOps Homelab Platform
  </text>

  <!-- Korean Highlights -->
  <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="400" letter-spacing="-0.01em" fill="#8B95A1">
    Apple Silicon + Tart 기반 4-클러스터 K8s 보안 자동화 플랫폼
  </text>
  <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="400" letter-spacing="-0.01em" fill="#8B95A1">
    CI/CD 파이프라인 무중단 배포 및 엔터프라이즈 보안 규정 준수
  </text>

  <!-- Bottom Tech Stack Chips -->
  <g transform="translate(24, 184)">
    <!-- Pill 1: DevSecOps -->
    <g transform="translate(0, 0)">
      <rect width="82" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="41" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">DevSecOps</text>
    </g>
    <!-- Pill 2: 4-Cluster K8s -->
    <g transform="translate(88, 0)">
      <rect width="90" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="45" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">4-Cluster K8s</text>
    </g>
    <!-- Pill 3: Tart VM -->
    <g transform="translate(184, 0)">
      <rect width="70" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="35" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">Tart VM</text>
    </g>
    <!-- Pill 4: CI/CD -->
    <g transform="translate(260, 0)">
      <rect width="64" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">CI / CD</text>
    </g>
  </g>
</svg>
