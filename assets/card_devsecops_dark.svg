<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBgSecDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <filter id="shadowSecDark" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="2" y="2" width="411" height="236" rx="16" fill="url(#cardBgSecDark)" stroke="#30363D" stroke-width="1.2" filter="url(#shadowSecDark)" />

  <!-- Top Category Badge -->
  <g transform="translate(20, 18)">
    <rect width="134" height="24" rx="12" fill="#1E1B4B" stroke="#3730A3" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#818CF8" />
    <text x="22" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.04em" fill="#A5B4FC">
      ZERO-TRUST
    </text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(372, 20)">
    <circle cx="11" cy="11" r="11" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <path d="M8.5 6.5h5v5M13.5 6.5L8 12" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Domain Subtitle -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.025em" fill="#F0F6FC">
    devsecops
  </text>
  <text x="20" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#818CF8">
    Enterprise DevSecOps 4-Cluster Platform
  </text>

  <!-- Bullets -->
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#C9D1D9">
    • Shift-Left CI/CD: Automated Trivy CVE gating &amp; Cosign signatures
  </text>
  <text x="20" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#C9D1D9">
    • Falco runtime syscall auditing &amp; Kyverno zero-root policy
  </text>

  <!-- Telemetry Strip -->
  <g transform="translate(20, 146)">
    <rect width="375" height="30" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
      🔒 CVE GATING: <tspan font-weight="700" fill="#818CF8">100% Blocked</tspan> &#160;&#160;|&#160;&#160; ⚡ ALERT: <tspan font-weight="700" fill="#3FB950">&lt; 500ms</tspan>
    </text>
  </g>

  <!-- Tech Pills -->
  <g transform="translate(0, 188)">
    <g transform="translate(20, 0)">
      <rect width="70" height="26" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <text x="35" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#8B949E" text-anchor="middle">Trivy</text>
    </g>
    <g transform="translate(98, 0)">
      <rect width="70" height="26" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <text x="35" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#8B949E" text-anchor="middle">Falco</text>
    </g>
    <g transform="translate(176, 0)">
      <rect width="84" height="26" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#8B949E" text-anchor="middle">Kyverno</text>
    </g>
    <g transform="translate(268, 0)">
      <rect width="125" height="26" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <text x="62.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#8B949E" text-anchor="middle">GitOps Security</text>
    </g>
  </g>
