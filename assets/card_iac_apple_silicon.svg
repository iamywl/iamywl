<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B151C" />
      <stop offset="55%" stop-color="#060E14" />
      <stop offset="100%" stop-color="#030608" />
    </linearGradient>

    <!-- visionOS Specular Rim Gradient (135°) -->
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Ambient Glow: Emerald / Teal Accent -->
    <radialGradient id="cardGlow3" cx="88%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Telemetry Box Background -->
    <linearGradient id="telemBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="telemBorder3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.20" />
    </linearGradient>

    <!-- Stack Pill Background -->
    <linearGradient id="pillBg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="sheen3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip3">
      <rect x="1" y="1" width="413" height="238" rx="20" />
    </clipPath>

    <style>
      @keyframes cardSheen3 {
        0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
        25% { opacity: 0.6; }
        60% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
        100% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
      }
      @keyframes telemPulse3 {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(52, 211, 153, 0.25)); }
        50% { filter: drop-shadow(0 0 7px rgba(16, 185, 129, 0.55)); }
      }
      .card-sheen-sweep3 {
        animation: cardSheen3 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .telem-box3 {
        animation: telemPulse3 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Unibody Card Canvas -->
  <rect x="1" y="1" width="413" height="238" rx="20" fill="url(#bgGrad3)" stroke="url(#borderGrad3)" stroke-width="1.2" />
  <rect x="1" y="1" width="413" height="238" rx="20" fill="url(#cardGlow3)" />

  <!-- Sheen Sweep -->
  <g clip-path="url(#cardClip3)">
    <rect class="card-sheen-sweep3" x="0" y="0" width="120" height="240" fill="url(#sheen3)" />
  </g>

  <!-- Top Domain Pill -->
  <g transform="translate(20, 20)">
    <rect width="168" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />
    <text x="84" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#34D399" text-anchor="middle">
      ⚙️ ARM64 IAC SYSTEMS
    </text>
  </g>

  <!-- Repository Action Arrow Link -->
  <g transform="translate(367, 18)">
    <circle cx="14" cy="14" r="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8" />
    <path d="M10 18L18 10M18 10H12M18 10V16" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title: IaC_apple_sillicon -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
    IaC_apple_sillicon
  </text>

  <!-- Subtitle -->
  <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="12" font-weight="600" letter-spacing="-0.01em" fill="#34D399">
    Apple Silicon Native Multi-Cluster K8s IaC
  </text>

  <!-- Architecture Highlights -->
  <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
    • 100% declarative Terraform module managing Tart macOS VMs
  </text>
  <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">
    • Cloud-Init auto-injection + VirtIO-net / VirtIO-blk acceleration
  </text>

  <!-- Dedicated Telemetry Glass Box -->
  <g class="telem-box3" transform="translate(20, 148)">
    <rect width="375" height="32" rx="8" fill="url(#telemBg3)" stroke="url(#telemBorder3)" stroke-width="1" />
    <!-- Metric 1 -->
    <text x="14" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">
      ⚡ PROVISIONING: <tspan fill="#34D399" font-weight="800">&lt; 42s Ready</tspan>
    </text>
    <line x1="182" y1="8" x2="182" y2="24" stroke="#334155" stroke-width="1" />
    <!-- Metric 2 -->
    <text x="195" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">
      ⚙️ AUTOMATION: <tspan fill="#38BDF8" font-weight="800">100% Terraform</tspan>
    </text>
  </g>

  <!-- Bottom Tech Stack Chips -->
  <g transform="translate(20, 196)">
    <!-- Pill 1: Terraform -->
    <g transform="translate(0, 0)">
      <rect width="78" height="24" rx="7" fill="url(#pillBg3)" stroke="#334155" stroke-width="0.8" />
      <text x="39" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Terraform</text>
    </g>
    <!-- Pill 2: Apple Silicon -->
    <g transform="translate(86, 0)">
      <rect width="94" height="24" rx="7" fill="url(#pillBg3)" stroke="#334155" stroke-width="0.8" />
      <text x="47" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Apple Silicon</text>
    </g>
    <!-- Pill 3: Tart VM -->
    <g transform="translate(188, 0)">
      <rect width="70" height="24" rx="7" fill="url(#pillBg3)" stroke="#334155" stroke-width="0.8" />
      <text x="35" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Tart VM</text>
    </g>
    <!-- Pill 4: Ansible -->
    <g transform="translate(266, 0)">
      <rect width="66" height="24" rx="7" fill="url(#pillBg3)" stroke="#334155" stroke-width="0.8" />
      <text x="33" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Ansible</text>
    </g>
  </g>
</svg>
