<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="411" height="236" rx="18" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Top Badge -->
  <g transform="translate(20, 18)">
    <rect width="184.0" height="24" rx="12" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.04em" fill="#2563EB">
      ⚡ HIGH-CONCURRENCY WAS
    </text>
  </g>

  <!-- Arrow Link Button -->
  <g transform="translate(365, 18)">
    <circle cx="15" cy="12" r="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <path d="M12 9l6 0m0 0l0 6m0-6l-7 7" stroke="#3182F6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.025em" fill="#0F172A">
    Middleware_Hello
  </text>

  <!-- Domain Subtitle -->
  <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#2563EB">
