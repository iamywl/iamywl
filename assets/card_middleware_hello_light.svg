          <text x="57.0" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Linux Kernel</text>
        </g>
        <g transform="translate(142.0, 0)">
