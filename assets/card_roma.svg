<svg width="415" height="230" viewBox="0 0 415 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Ambient Glow: Purple Indigo -->
    <radialGradient id="cardGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#BF5AF2" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Delicate Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#BF5AF2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Card Base with Soft 20px TDS Radius -->
  <rect x="1" y="1" width="413" height="228" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="413" height="228" rx="20" fill="url(#cardGlow)" />

  <!-- Top Domain Pill & Action Icon -->
  <g transform="translate(24, 24)">
    <rect width="194" height="22" rx="11" fill="#BF5AF2" fill-opacity="0.12" stroke="#BF5AF2" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="97" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.1em" fill="#BF5AF2" text-anchor="middle">
      🚀 DISTRIBUTED BACKEND &amp; DB
    </text>
  </g>

  <!-- Repository Action Arrow -->
  <g transform="translate(372, 28)">
    <circle cx="10" cy="10" r="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
    <path d="M7 13L13 7M13 7H8.5M13 7V11.5" stroke="#8B95A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title: Project Name -->
  <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
    ROMA
  </text>

  <!-- English Description -->
  <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="12.5" font-weight="600" letter-spacing="-0.01em" fill="#E879F9">
    Scalable Roommate Matching Cloud Backend
  </text>

  <!-- Korean Highlights -->
  <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="400" letter-spacing="-0.01em" fill="#8B95A1">
    분산 서비스 아키텍처 기반 매칭 서비스 백엔드 및
  </text>
  <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="400" letter-spacing="-0.01em" fill="#8B95A1">
    PostgreSQL 비동기 고속 데이터 파이프라인과 컨테이너 환경
  </text>

  <!-- Bottom Tech Stack Chips -->
  <g transform="translate(24, 184)">
    <!-- Pill 1: FastAPI -->
    <g transform="translate(0, 0)">
      <rect width="68" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">FastAPI</text>
    </g>
    <!-- Pill 2: PostgreSQL -->
    <g transform="translate(74, 0)">
      <rect width="86" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="43" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">PostgreSQL</text>
    </g>
    <!-- Pill 3: Docker -->
    <g transform="translate(166, 0)">
      <rect width="64" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">Docker</text>
    </g>
    <!-- Pill 4: Async DB -->
    <g transform="translate(236, 0)">
      <rect width="76" height="24" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="0.8" />
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">Async DB</text>
    </g>
  </g>
</svg>
