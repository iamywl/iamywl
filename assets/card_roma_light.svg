<svg width="415" height="240" viewBox="0 0 415 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBgRomaLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadowRomaLight" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect x="2" y="2" width="411" height="236" rx="16" fill="url(#cardBgRomaLight)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadowRomaLight)" />

  <!-- Top Category Badge -->
  <g transform="translate(20, 18)">
    <rect width="168" height="24" rx="12" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#0D9488" />
    <text x="22" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.04em" fill="#0F766E">
      DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(372, 20)">
    <circle cx="11" cy="11" r="11" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <path d="M8.5 6.5h5v5M13.5 6.5L8 12" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Domain Subtitle -->
  <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.025em" fill="#0F172A">
    ROMA
  </text>
  <text x="20" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12" font-weight="600" fill="#0D9488">
    High-Scale Cloud Microservice Backend
  </text>

  <!-- Bullets -->
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#334155">
    • Kubernetes microservice deployment with automated HPA scaling
  </text>
  <text x="20" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="400" fill="#334155">
    • Multi-tiered Redis distributed caching prevents DB overload
  </text>

  <!-- Telemetry Strip -->
  <g transform="translate(20, 146)">
    <rect width="375" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">
      ⏱️ LATENCY: <tspan font-weight="700" fill="#0D9488">p95 &lt; 38ms</tspan> &#160;&#160;|&#160;&#160; 🎯 CACHE HIT: <tspan font-weight="700" fill="#2563EB">94%+ Redis</tspan>
    </text>
  </g>

  <!-- Tech Pills -->
  <g transform="translate(0, 188)">
    <g transform="translate(20, 0)">
      <rect width="80" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="40" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">K8s HPA</text>
    </g>
    <g transform="translate(108, 0)">
      <rect width="94" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="47" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Redis Cache</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="92" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="46" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(308, 0)">
      <rect width="86" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="43" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Cloud Native</text>
    </g>
