<svg width="850" height="110" viewBox="0 0 850 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Apple Space Gray & GitHub Canvas) -->
    <linearGradient id="focusBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Spectrum Bar Gradient Dark -->
    <linearGradient id="eqBarGradDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#79B8FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <style>
      @keyframes eqBounce1Dark { 0%, 100% { height: 6px; y: 26px; } 50% { height: 26px; y: 6px; } }
      @keyframes eqBounce2Dark { 0%, 100% { height: 22px; y: 10px; } 50% { height: 10px; y: 22px; } }
      @keyframes eqBounce3Dark { 0%, 100% { height: 14px; y: 18px; } 50% { height: 30px; y: 2px; } }
      @keyframes eqBounce4Dark { 0%, 100% { height: 28px; y: 4px; } 50% { height: 8px; y: 24px; } }
      @keyframes livePulseDotDark { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.3); } }

      .bd-1 { animation: eqBounce1Dark 1.2s ease-in-out infinite; }
      .bd-2 { animation: eqBounce2Dark 0.9s ease-in-out infinite 0.15s; }
      .bd-3 { animation: eqBounce3Dark 1.4s ease-in-out infinite 0.3s; }
      .bd-4 { animation: eqBounce4Dark 1.1s ease-in-out infinite 0.1s; }
      .bd-5 { animation: eqBounce2Dark 1.3s ease-in-out infinite 0.25s; }
      .bd-6 { animation: eqBounce1Dark 0.85s ease-in-out infinite 0.4s; }
      .bd-7 { animation: eqBounce3Dark 1.05s ease-in-out infinite 0.2s; }
      .bd-8 { animation: eqBounce4Dark 1.25s ease-in-out infinite 0.35s; }
      .live-emerald-dot-dark { animation: livePulseDotDark 2s ease-in-out infinite; transform-origin: 5px 5px; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="106" rx="16" fill="url(#focusBgDark)" stroke="#30363D" stroke-width="1.2" />

  <!-- Play / Sound Icon Controller -->
  <g transform="translate(24, 25)">
    <rect width="60" height="60" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1.2" />
    <circle cx="30" cy="30" r="17" fill="#58A6FF" />
    <!-- Play Triangle -->
    <path d="M26 22.5 L38 30 L26 37.5 Z" fill="#0D1117" />
  </g>

  <!-- Track Information & Scrubber -->
  <g transform="translate(100, 24)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="3.5" fill="#3FB950" class="live-emerald-dot-dark" />
      <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" fill="#58A6FF" letter-spacing="0.06em">
        NOW FOCUSING · AMBIENT FREQUENCY
      </text>
    </g>

    <!-- Track Title -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="14.5" font-weight="700" fill="#F0F6FC">
      Kernel Tracing &amp; Distributed Consensus (432Hz Ambient Flow)
    </text>

    <!-- Subtitle & Timeline Scrubber Bar -->
    <g transform="translate(0, 48)">
      <!-- Scrubber Track Line -->
      <rect width="360" height="4" rx="2" fill="#21262D" />
      <rect width="254" height="4" rx="2" fill="#58A6FF" />
      <circle cx="254" cy="2" r="5" fill="#58A6FF" stroke="#0D1117" stroke-width="1.5" />
      <text x="375" y="6" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#8B949E">
        42:18 / 60:00
      </text>
    </g>
  </g>

  <!-- Right: 16-Band Waveform Equalizer & Hi-Res Badge -->
  <g transform="translate(680, 24)">
    <!-- Hi-Res Audio Badge -->
    <rect x="0" y="0" width="144" height="20" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="72" y="14" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" fill="#58A6FF" text-anchor="middle">
      LOSSLESS · 24-BIT / 96kHz
    </text>

    <!-- 16 Equalizer Bars -->
    <g transform="translate(0, 28)">
      <rect class="bd-1" x="0" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-2" x="9" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-3" x="18" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-4" x="27" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-5" x="36" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-6" x="45" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-7" x="54" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-8" x="63" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-3" x="72" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-2" x="81" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-1" x="90" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-4" x="99" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-5" x="108" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-7" x="117" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-6" x="126" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
      <rect class="bd-8" x="135" width="4.5" rx="2.25" fill="url(#eqBarGradDark)" />
    </g>
  </g>
</svg>
