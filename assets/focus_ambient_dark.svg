<svg width="850" height="110" viewBox="0 0 850 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="barGradDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#79B8FF" />
    </linearGradient>
    <style>
      @keyframes eq1 { 0%, 100% { height: 8px; y: 26px; } 50% { height: 28px; y: 6px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; y: 10px; } 50% { height: 12px; y: 22px; } }
      @keyframes eq3 { 0%, 100% { height: 16px; y: 18px; } 50% { height: 32px; y: 2px; } }
      @keyframes eq4 { 0%, 100% { height: 30px; y: 4px; } 50% { height: 10px; y: 24px; } }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .bar-1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.9s ease-in-out infinite 0.2s; }
      .bar-3 { animation: eq3 1.4s ease-in-out infinite 0.4s; }
      .bar-4 { animation: eq4 1.1s ease-in-out infinite 0.1s; }
      .bar-5 { animation: eq2 1.3s ease-in-out infinite 0.3s; }
      .bar-6 { animation: eq1 0.8s ease-in-out infinite 0.5s; }
      .bar-7 { animation: eq3 1.0s ease-in-out infinite 0.2s; }
      .bar-8 { animation: eq4 1.2s ease-in-out infinite 0.4s; }
      .live-dot { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="848" height="108" rx="14" fill="url(#bgDark)" stroke="#30363D" stroke-width="1.2" />

  <!-- Play / Sound Icon Button -->
  <g transform="translate(24, 25)">
    <rect width="60" height="60" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle cx="30" cy="30" r="16" fill="#58A6FF" />
    <path d="M26 23 L38 30 L26 37 Z" fill="#0D1117" />
  </g>

  <!-- Track Meta -->
  <g transform="translate(102, 28)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4" fill="#3FB950" class="live-dot" />
      <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#58A6FF" letter-spacing="0.5">NOW FOCUSING · AMBIENT FREQUENCY</text>
    </g>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="14.5" font-weight="700" fill="#F0F6FC">
      Kernel Tracing &amp; Distributed Consensus (432Hz Ambient Flow)
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="500" fill="#8B949E">
      Track 04 · Lossless 24-bit / 96kHz High-Fidelity · Deep Systems Architecture Session
    </text>
  </g>

  <!-- Modern Linear Equalizer -->
  <g transform="translate(680, 36)">
    <rect class="bar-1" x="0" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-2" x="9" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-3" x="18" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-4" x="27" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-5" x="36" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-6" x="45" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-7" x="54" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-8" x="63" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-2" x="72" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-1" x="81" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-3" x="90" width="4" rx="2" fill="url(#barGradDark)" />
    <rect class="bar-4" x="99" width="4" rx="2" fill="url(#barGradDark)" />
    <text x="50" y="52" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="600" fill="#8B949E" text-anchor="middle">42:18 / 60:00</text>
  </g>
</svg>
