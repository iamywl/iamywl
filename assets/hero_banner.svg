<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#020306" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Toss Ambient Spotlight Glow -->
    <radialGradient id="tossGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#1B64DA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Apple Titanium Edge Border -->
    <linearGradient id="titaniumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#3182F6" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <!-- Headline Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- TDS Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Unibody Card Canvas with Soft 24px Radius -->
  <rect x="1" y="1" width="848" height="258" rx="24" fill="url(#bgGrad)" stroke="url(#titaniumBorder)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="258" rx="24" fill="url(#tossGlow)" />

  <!-- Overline Badge: Toss Blue Accent -->
  <g transform="translate(425, 42)" text-anchor="middle">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#3182F6" fill-opacity="0.12" stroke="#3182F6" stroke-opacity="0.35" stroke-width="1" />
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.16em" fill="#3182F6">
       ARCHITECTURE &amp; SYSTEMS CRAFT
    </text>
  </g>

  <!-- Confident Identity: iamywl -->
  <g transform="translate(425, 102)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.035em" fill="url(#textGrad)">
      iamywl
    </text>
  </g>

  <!-- Toss-Style Conversational Mission Subtitle -->
  <g transform="translate(425, 142)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="15" font-weight="600" letter-spacing="-0.02em" fill="#F1F5F9">
      시스템의 가장 깊은 곳부터 대규모 클라우드까지
    </text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="13" font-weight="400" letter-spacing="-0.01em" fill="#8B95A1">
      Linux Kernel Tracing · High-Availability Kubernetes · Zero-Trust DevSecOps
    </text>
  </g>

  <!-- Key Pillars: Toss TDS Soft Bento Chips -->
  <g transform="translate(425, 208)" text-anchor="middle">
    <!-- Pillar 1: eBPF & Kernel -->
    <g transform="translate(-244, 0)">
      <rect x="-96" y="-15" width="192" height="30" rx="15" fill="url(#pillGrad)" stroke="#3182F6" stroke-opacity="0.3" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🛡️ eBPF &amp; Kernel Tracing
      </text>
    </g>

    <!-- Pillar 2: Cloud Native K8s -->
    <g transform="translate(0, 0)">
      <rect x="-96" y="-15" width="192" height="30" rx="15" fill="url(#pillGrad)" stroke="#3182F6" stroke-opacity="0.3" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ☁️ Cloud Native K8s
      </text>
    </g>

    <!-- Pillar 3: DevSecOps -->
    <g transform="translate(244, 0)">
      <rect x="-96" y="-15" width="192" height="30" rx="15" fill="url(#pillGrad)" stroke="#3182F6" stroke-opacity="0.3" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🔒 Zero-Trust DevSecOps
      </text>
    </g>
  </g>
</svg>
