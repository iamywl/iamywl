<svg width="850" height="300" viewBox="0 0 850 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="45%" stop-color="#030509" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- visionOS Specular Bevel Rim (135° Directional) -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="25%" stop-color="#3182F6" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>

    <!-- Ambient Glow: Toss Blue -->
    <radialGradient id="tossAmbient" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#1B64DA" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow: Cyan Refraction -->
    <radialGradient id="cyanAmbient" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Headline Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Telemetry Chip Glass Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="chipBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#3182F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15" />
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for Sheen Sweep -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="848" height="298" rx="24" />
    </clipPath>

    <style>
      @keyframes sheenSweep {
        0% {
          transform: translateX(-150%) skewX(-20deg);
          opacity: 0;
        }
        20% {
          opacity: 0.7;
        }
        55% {
          transform: translateX(250%) skewX(-20deg);
          opacity: 0;
        }
        100% {
          transform: translateX(250%) skewX(-20deg);
          opacity: 0;
        }
      }

      @keyframes beaconPulse {
        0% {
          r: 4px;
          opacity: 0.95;
        }
        60% {
          r: 10px;
          opacity: 0.15;
        }
        100% {
          r: 13px;
          opacity: 0;
        }
      }

      @keyframes corePulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.18);
          opacity: 0.85;
        }
      }

      @keyframes telemetryWave {
        0%, 100% {
          opacity: 0.8;
          filter: drop-shadow(0 0 2px rgba(49, 130, 246, 0.3));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 7px rgba(6, 182, 212, 0.6));
        }
      }

      .specular-sheen {
        animation: sheenSweep 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .beacon-wave {
        animation: beaconPulse 2.2s ease-out infinite;
        transform-origin: 215px 38px;
      }

      .beacon-core {
        animation: corePulse 2.2s ease-in-out infinite;
        transform-origin: 215px 38px;
      }

      .telemetry-row {
        animation: telemetryWave 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Obsidian Unibody with 24px Radius -->
  <rect x="1" y="1" width="848" height="298" rx="24" fill="url(#bgGrad)" stroke="url(#specularRim)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="298" rx="24" fill="url(#tossAmbient)" />
  <rect x="1" y="1" width="848" height="298" rx="24" fill="url(#cyanAmbient)" />

  <!-- Animated Specular Sheen Overlay -->
  <g clip-path="url(#cardClip)">
    <rect class="specular-sheen" x="0" y="0" width="220" height="300" fill="url(#sheenGrad)" />
  </g>

  <!-- Live Status Capsule (y: 24 - 52) -->
  <g transform="translate(425, 38)" text-anchor="middle">
    <!-- Capsule Glass Pill -->
    <rect x="-225" y="-14" width="450" height="28" rx="14" fill="#0B132B" fill-opacity="0.75" stroke="#10B981" stroke-opacity="0.38" stroke-width="1" />
    
    <!-- Pulsing Emerald Beacon -->
    <circle class="beacon-wave" cx="-195" cy="0" r="4" fill="#10B981" />
    <circle class="beacon-core" cx="-195" cy="0" r="4" fill="#34D399" />
    
    <text x="8" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#34D399">
      INFRASTRUCTURE &amp; SECURITY ARCHITECT | SRE &amp; PLATFORM
    </text>
  </g>

  <!-- Confident Identity: @iamywl (y: 106) -->
  <g transform="translate(425, 110)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.035em" fill="url(#textGrad)">
      @iamywl
    </text>
  </g>

  <!-- Conversational Mission Subtitles (y: 148, 172) -->
  <g transform="translate(425, 150)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="15" font-weight="600" letter-spacing="-0.02em" fill="#F1F5F9">
      시스템 최하단 리눅스 커널부터 대규모 멀티 클러스터 쿠버네티스까지
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="13" font-weight="400" letter-spacing="-0.01em" fill="#94A3B8">
      Linux Kernel Tracing (eBPF) · Cloud Native K8s (Tart VM) · Zero-Trust DevSecOps
    </text>
  </g>

  <!-- Hard Telemetry Pill Strip (y: 218) -->
  <g class="telemetry-row" transform="translate(425, 230)" text-anchor="middle">
    <!-- Chip 1: eBPF Hook Latency -->
    <g transform="translate(-270, 0)">
      <rect x="-124" y="-17" width="248" height="34" rx="17" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ⚡ <tspan fill="#38BDF8" font-weight="700">&lt; 1.2μs</tspan> eBPF Hook Latency
      </text>
    </g>

    <!-- Chip 2: 4-Node Tart VM K8s -->
    <g transform="translate(0, 0)">
      <rect x="-132" y="-17" width="264" height="34" rx="17" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ☁️ 4-Node Tart VM K8s (<tspan fill="#34D399" font-weight="700">99.9% SLA</tspan>)
      </text>
    </g>

    <!-- Chip 3: Automated DevSecOps Gating -->
    <g transform="translate(270, 0)">
      <rect x="-124" y="-17" width="248" height="34" rx="17" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🔒 <tspan fill="#F472B6" font-weight="700">100% Gated</tspan> DevSecOps CVEs
      </text>
    </g>
  </g>

  <!-- Bottom Frosted Ambient Accent Line -->
  <line x1="120" y1="282" x2="730" y2="282" stroke="url(#specularRim)" stroke-opacity="0.3" stroke-width="1" />
</svg>
