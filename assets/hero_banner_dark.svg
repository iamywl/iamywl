<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Apple Space Gray & GitHub Canvas) -->
    <linearGradient id="heroBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#090D13" />
    </linearGradient>

    <!-- Deep Ambient Glow -->
    <radialGradient id="meshGlowDark" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accent Gradient Dark -->
    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#79B8FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Grid Pattern Dark -->
    <pattern id="gridPatternDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <!-- Specular Hairline Stroke -->
    <linearGradient id="rimStrokeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#161B22" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes beaconPulseDark {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.3; }
      }
      .beacon-ring-dark { transform-origin: 0 0; animation: beaconPulseDark 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#heroBgDark)" stroke="url(#rimStrokeDark)" stroke-width="1.2" />
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#gridPatternDark)" />
  <rect x="2" y="2" width="846" height="180" rx="20" fill="url(#meshGlowDark)" />

  <!-- Top Pill: Status & Architecture Specialization -->
  <g transform="translate(425, 34)" text-anchor="middle">
    <rect x="-215" y="-14" width="430" height="28" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <!-- Live Beacon -->
    <g transform="translate(-188, 0)">
      <circle class="beacon-ring-dark" cx="0" cy="0" r="5" fill="#38BDF8" opacity="0.4" />
      <circle cx="0" cy="0" r="3.5" fill="#58A6FF" />
    </g>
    <text x="6" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#93C5FD">
      INFRASTRUCTURE &amp; SECURITY ARCHITECT · SRE &amp; CLOUD NATIVE
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(425, 102)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="33" font-weight="800" letter-spacing="-0.03em" fill="#F0F6FC">
      안녕하세요 👋 <tspan fill="url(#accentGradDark)">@iamywl</tspan>입니다.
    </text>
  </g>

  <!-- Sub-Headline & Engineering Mission -->
  <g transform="translate(425, 142)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="14.5" font-weight="500" letter-spacing="-0.015em" fill="#C9D1D9">
      시스템 최하단 <tspan font-weight="700" fill="#F0F6FC">리눅스 커널(eBPF)</tspan>부터 대규모 <tspan font-weight="700" fill="#F0F6FC">멀티 클러스터 쿠버네티스</tspan>까지 설계하고 운영합니다.
    </text>
    <text y="23" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="12" font-weight="500" letter-spacing="0.01em" fill="#8B949E">
      Linux Kernel Introspection · Apple Silicon Native K8s (Tart VM) · Zero-Trust DevSecOps GitOps
    </text>
  </g>

  <!-- Bottom Telemetry Metric Strip (3 Glass Capsules) -->
  <g transform="translate(425, 216)" text-anchor="middle">
    <!-- Metric 1: Kernel Hook Latency -->
    <g transform="translate(-272, 0)">
      <rect x="-124" y="-16" width="248" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
      <circle cx="-100" cy="0" r="3.5" fill="#58A6FF" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        ⚡ <tspan fill="#58A6FF" font-weight="800">&lt; 1.2μs</tspan> eBPF Hook Latency
      </text>
    </g>

    <!-- Metric 2: Tart VM Multi-Cluster SLA -->
    <g transform="translate(0, 0)">
      <rect x="-132" y="-16" width="264" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
      <circle cx="-108" cy="0" r="3.5" fill="#3FB950" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        ☁️ Tart VM K8s (<tspan fill="#3FB950" font-weight="800">99.9% Uptime SLA</tspan>)
      </text>
    </g>

    <!-- Metric 3: Zero-Trust CVE Gating -->
    <g transform="translate(272, 0)">
      <rect x="-124" y="-16" width="248" height="32" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
      <circle cx="-100" cy="0" r="3.5" fill="#A78BFA" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        🔒 <tspan fill="#A78BFA" font-weight="800">100% Gated</tspan> Trivy CVE Blocking
      </text>
    </g>
  </g>
</svg>
