<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04" />
    </linearGradient>
    <style>
      @keyframes wavePulse {
        0%, 100% { opacity: 0.85; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.04); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; r: 4px; }
        50% { opacity: 0.3; r: 6.5px; }
      }
      .wave-path { animation: wavePulse 6s ease-in-out infinite; transform-origin: bottom; }
      .live-beacon { animation: beaconBlink 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="846" height="256" rx="22" fill="url(#heroBg)" stroke="#30363D" stroke-width="1.2" />
  <path class="wave-path" d="M2 170 C 220 130, 480 210, 848 160 L 848 256 C 848 268, 836 256, 824 256 L 26 256 C 14 256, 2 244, 2 232 Z" fill="url(#blueGlow)" />

  <!-- Top Status Capsule -->
  <g transform="translate(425, 36)" text-anchor="middle">
    <rect x="-210" y="-13" width="420" height="26" rx="13" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle class="live-beacon" cx="-185" cy="0" r="4" fill="#38BDF8" />
    <circle cx="-185" cy="0" r="2.5" fill="#38BDF8" />
    <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#60A5FA">
      INFRASTRUCTURE &amp; SECURITY ARCHITECT · SRE &amp; CLOUD NATIVE
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(425, 102)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#F0F6FC">
      안녕하세요 👋 <tspan fill="#58A6FF">@iamywl</tspan>입니다.
    </text>
  </g>

  <!-- Mission Statement -->
  <g transform="translate(425, 142)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="14.5" font-weight="500" letter-spacing="-0.015em" fill="#C9D1D9">
      시스템 최하단 <tspan font-weight="700" fill="#FFFFFF">리눅스 커널(eBPF)</tspan>부터 대규모 <tspan font-weight="700" fill="#FFFFFF">멀티 클러스터 쿠버네티스</tspan>까지 설계하고 운영합니다.
    </text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Pretendard', sans-serif" font-size="12.5" font-weight="400" fill="#8B949E">
      Linux Kernel Introspection · Apple Silicon Native K8s (Tart VM) · Zero-Trust DevSecOps GitOps
    </text>
  </g>

  <!-- Telemetry Strip -->
  <g transform="translate(425, 216)" text-anchor="middle">
    <g transform="translate(-270, 0)">
      <rect x="-124" y="-15" width="248" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        ⚡ <tspan fill="#58A6FF" font-weight="700">&lt; 1.2μs</tspan> eBPF Hook Latency
      </text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-130" y="-15" width="260" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        ☁️ 4-Node Tart VM K8s (<tspan fill="#3FB950" font-weight="700">99.9% Uptime</tspan>)
      </text>
    </g>
    <g transform="translate(270, 0)">
      <rect x="-124" y="-15" width="248" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">
        🔒 <tspan fill="#A78BFA" font-weight="700">100% Gated</tspan> Trivy CVE Blocking
      </text>
    </g>
  </g>
</svg>