<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Toss Ceramic Clean White & Subtle Slate) -->
    <linearGradient id="heroBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Subtle Radial Glow for Depth -->
    <radialGradient id="meshGlowLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accent Gradient -->
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#3182F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Grid Pattern (Linear/Stripe Craft) -->
    <pattern id="gridPatternLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>

    <!-- Ambient Shadow -->
    <filter id="softCardShadowLight" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <style>
      @keyframes beaconPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.3; }
      }
      @keyframes floatBeam {
        0%, 100% { transform: translateX(0); opacity: 0.7; }
        50% { transform: translateX(30px); opacity: 1; }
      }
      .beacon-ring { transform-origin: 0 0; animation: beaconPulse 2.4s ease-in-out infinite; }
      .ambient-beam { animation: floatBeam 8s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#heroBgLight)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softCardShadowLight)" />
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#gridPatternLight)" />
  <rect x="2" y="2" width="846" height="180" rx="20" fill="url(#meshGlowLight)" />

  <!-- Top Pill: Status & Architecture Specialization -->
  <g transform="translate(425, 34)" text-anchor="middle">
    <rect x="-215" y="-14" width="430" height="28" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1" />
    <!-- Live Beacon -->
    <g transform="translate(-188, 0)">
      <circle class="beacon-ring" cx="0" cy="0" r="5" fill="#3B82F6" opacity="0.4" />
      <circle cx="0" cy="0" r="3.5" fill="#2563EB" />
    </g>
    <text x="6" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#1D4ED8">
      INFRASTRUCTURE &amp; SECURITY ARCHITECT · SRE &amp; CLOUD NATIVE
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(425, 102)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Display', sans-serif" font-size="33" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
      안녕하세요 👋 <tspan fill="url(#accentGradLight)">@iamywl</tspan>입니다.
    </text>
  </g>

  <!-- Sub-Headline & Engineering Mission -->
  <g transform="translate(425, 142)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="14.5" font-weight="500" letter-spacing="-0.015em" fill="#334155">
      시스템 최하단 <tspan font-weight="700" fill="#0F172A">리눅스 커널(eBPF)</tspan>부터 대규모 <tspan font-weight="700" fill="#0F172A">멀티 클러스터 쿠버네티스</tspan>까지 설계하고 운영합니다.
    </text>
    <text y="23" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif" font-size="12" font-weight="500" letter-spacing="0.01em" fill="#64748B">
      Linux Kernel Introspection · Apple Silicon Native K8s (Tart VM) · Zero-Trust DevSecOps GitOps
    </text>
  </g>

  <!-- Bottom Telemetry Metric Strip (3 Glass Capsules) -->
  <g transform="translate(425, 216)" text-anchor="middle">
    <!-- Metric 1: Kernel Hook Latency -->
    <g transform="translate(-272, 0)">
      <rect x="-124" y="-16" width="248" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <circle cx="-100" cy="0" r="3.5" fill="#2563EB" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">
        ⚡ <tspan fill="#2563EB" font-weight="800">&lt; 1.2μs</tspan> eBPF Hook Latency
      </text>
    </g>

    <!-- Metric 2: Tart VM Multi-Cluster SLA -->
    <g transform="translate(0, 0)">
      <rect x="-132" y="-16" width="264" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <circle cx="-108" cy="0" r="3.5" fill="#059669" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">
        ☁️ Tart VM K8s (<tspan fill="#059669" font-weight="800">99.9% Uptime SLA</tspan>)
      </text>
    </g>

    <!-- Metric 3: Zero-Trust CVE Gating -->
    <g transform="translate(272, 0)">
      <rect x="-124" y="-16" width="248" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <circle cx="-100" cy="0" r="3.5" fill="#4F46E5" />
      <text x="10" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">
        🔒 <tspan fill="#4F46E5" font-weight="800">100% Gated</tspan> Trivy CVE Blocking
      </text>
    </g>
  </g>
</svg>
