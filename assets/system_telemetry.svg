<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="telemBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#03050A" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- visionOS Specular Rim Gradient (135°) -->
    <linearGradient id="telemOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#3182F6" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Gauge Sub-card Glass Background -->
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#080C16" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="gaugeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="telemSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gauge 4 Progress Bar Gradient -->
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3182F6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <clipPath id="telemClip">
      <rect x="1" y="1" width="848" height="178" rx="20" />
    </clipPath>

    <style>
      @keyframes throughputFlow {
        0% {
          stroke-dashoffset: 120;
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.5;
        }
      }

      @keyframes beaconPulseTelem {
        0% {
          r: 4px;
          opacity: 0.95;
        }
        60% {
          r: 9px;
          opacity: 0.15;
        }
        100% {
          r: 12px;
          opacity: 0;
        }
      }

      @keyframes corePulseTelem {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.85;
        }
      }

      @keyframes metricGlowVal {
        0%, 100% {
          filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.65));
        }
      }

      @keyframes telemSheenSweep {
        0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
        20% { opacity: 0.5; }
        50% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
        100% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
      }

      .throughput-line {
        stroke-dasharray: 8 4;
        animation: throughputFlow 3s linear infinite;
      }

      .beacon-wave-telem {
        animation: beaconPulseTelem 2.2s ease-out infinite;
        transform-origin: 395px 63px;
      }

      .beacon-core-telem {
        animation: corePulseTelem 2.2s ease-in-out infinite;
        transform-origin: 395px 63px;
      }

      .telem-sheen-line {
        animation: telemSheenSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .val-glow {
        animation: metricGlowVal 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Unibody -->
  <rect x="1" y="1" width="848" height="178" rx="20" fill="url(#telemBgGrad)" stroke="url(#telemOuterRim)" stroke-width="1.2" />

  <!-- Sheen Sweep -->
  <g clip-path="url(#telemClip)">
    <rect class="telem-sheen-line" x="0" y="0" width="160" height="180" fill="url(#telemSheen)" />
  </g>

  <!-- ================= GAUGE 1: KERNEL HOOK LATENCY ================= -->
  <g transform="translate(17, 17)">
    <rect width="195" height="146" rx="14" fill="url(#gaugeBg)" stroke="url(#gaugeBorder)" stroke-width="1" />
    
    <!-- Header -->
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#38BDF8">
      ⚡ KERNEL HOOK LATENCY
    </text>

    <!-- Big Metric Value -->
    <text class="val-glow" x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">
      &lt; 1.2 <tspan font-size="16" font-weight="600" fill="#38BDF8">μs</tspan>
    </text>

    <!-- Sub-status description -->
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">
      Target &lt; 5.0μs · 100% In-Budget
    </text>

    <!-- Mini SVG Throughput Waveform -->
    <g transform="translate(14, 104)">
      <!-- Baseline background line -->
      <path d="M0 16 L25 16 L40 4 L55 24 L75 10 L95 18 L120 2 L140 16 L167 16" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />
      <!-- Animated glowing waveform line -->
      <path class="throughput-line" d="M0 16 L25 16 L40 4 L55 24 L75 10 L95 18 L120 2 L140 16 L167 16" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= GAUGE 2: CLUSTER AVAILABILITY SLA ================= -->
  <g transform="translate(224, 17)">
    <rect width="195" height="146" rx="14" fill="url(#gaugeBg)" stroke="url(#gaugeBorder)" stroke-width="1" />
    
    <!-- Header -->
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#34D399">
      🟢 CLUSTER AVAILABILITY
    </text>

    <!-- Big Metric Value + Live Beacon -->
    <g transform="translate(14, 66)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">
        99.9% <tspan font-size="16" font-weight="600" fill="#34D399">SLA</tspan>
      </text>
      <!-- Pulsing Beacon -->
      <circle class="beacon-wave-telem" cx="157" cy="-7" r="4" fill="#10B981" />
      <circle class="beacon-core-telem" cx="157" cy="-7" r="4" fill="#34D399" />
    </g>

    <!-- Sub-status description -->
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">
      4 Tart VM Nodes · 0-Downtime
    </text>

    <!-- Cluster Nodes Indicator Mini-Bar -->
    <g transform="translate(14, 110)">
      <rect x="0" y="0" width="37" height="14" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="18.5" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">CP-1</text>

      <rect x="43" y="0" width="37" height="14" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="61.5" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">WK-1</text>

      <rect x="86" y="0" width="37" height="14" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="104.5" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">WK-2</text>

      <rect x="129" y="0" width="37" height="14" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="147.5" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">WK-3</text>
    </g>
  </g>

  <!-- ================= GAUGE 3: DEVSECOPS POLICY ENFORCEMENT ================= -->
  <g transform="translate(431, 17)">
    <rect width="195" height="146" rx="14" fill="url(#gaugeBg)" stroke="url(#gaugeBorder)" stroke-width="1" />
    
    <!-- Header -->
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#F472B6">
      🔒 DEVSECOPS POLICY
    </text>

    <!-- Big Metric Value -->
    <text class="val-glow" x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">
      100% <tspan font-size="16" font-weight="600" fill="#F472B6">Gated</tspan>
    </text>

    <!-- Sub-status description -->
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">
      Trivy CVE Block · Falco Alert
    </text>

    <!-- Mini Security Guard Pills -->
    <g transform="translate(14, 108)">
      <rect x="0" y="0" width="76" height="18" rx="5" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="0.8" />
      <text x="38" y="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#F472B6" text-anchor="middle">0 Critical CVE</text>

      <rect x="84" y="0" width="82" height="18" rx="5" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.8" />
      <text x="125" y="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#C4B5FD" text-anchor="middle">Falco Active</text>
    </g>
  </g>

  <!-- ================= GAUGE 4: NETWORK CONCURRENCY ================= -->
  <g transform="translate(638, 17)">
    <rect width="195" height="146" rx="14" fill="url(#gaugeBg)" stroke="url(#gaugeBorder)" stroke-width="1" />
    
    <!-- Header -->
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#FBBF24">
      🚀 NETWORK CONCURRENCY
    </text>

    <!-- Big Metric Value -->
    <text class="val-glow" x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">
      10,000+ <tspan font-size="14" font-weight="600" fill="#FBBF24">Conn</tspan>
    </text>

    <!-- Sub-status description -->
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">
      epoll WAS · p99 &lt; 5ms Latency
    </text>

    <!-- Gauge Progress / Throughput Bar -->
    <g transform="translate(14, 110)">
      <!-- Progress Track -->
      <rect x="0" y="0" width="166" height="12" rx="6" fill="#1E293B" />
      <!-- Progress Fill (92% saturation) -->
      <rect x="0" y="0" width="152" height="12" rx="6" fill="url(#progGrad)" />
      <!-- High Throughput Tick -->
      <circle cx="152" cy="6" r="4" fill="#FFFFFF" />
    </g>
  </g>
</svg>
