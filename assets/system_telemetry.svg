<svg width="850" height="160" viewBox="0 0 850 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Ceramic White) -->
    <linearGradient id="telemetryBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Sparkline Gradient Fill -->
    <linearGradient id="sparklineGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3182F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3182F6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="connProgressGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <style>
      @keyframes pulseLiveLight {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      @keyframes sparkScan {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .telemetry-node-dot { animation: pulseLiveLight 2.2s ease-in-out infinite; transform-origin: 0 0; }
      .spark-line { stroke-dasharray: 120; animation: sparkScan 3s linear infinite; }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="156" rx="16" fill="url(#telemetryBgLight)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Gauge 1: Kernel Hook Latency -->
  <g transform="translate(16, 16)">
    <rect width="196" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#64748B">
      KERNEL HOOK LATENCY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#2563EB">
      &lt; 1.2 μs
    </text>
    <!-- Sparkline Graphic -->
    <path d="M14 78 Q 30 66, 50 74 T 90 70 T 130 76 T 160 68 T 182 72 L 182 86 L 14 86 Z" fill="url(#sparklineGradLight)" />
    <path d="M14 78 Q 30 66, 50 74 T 90 70 T 130 76 T 160 68 T 182 72" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#059669">
      ● Target &lt; 5.0 μs (100% In-Budget)
    </text>
  </g>

  <!-- Gauge 2: Cluster Availability -->
  <g transform="translate(224, 16)">
    <rect width="196" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#64748B">
      CLUSTER AVAILABILITY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#059669">
      99.9% SLA
    </text>
    <!-- Node Status Indicators -->
    <g transform="translate(14, 72)">
      <circle cx="4" cy="5" r="3.5" fill="#10B981" />
      <text x="14" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#334155">CP-01 (Tart)</text>
      <circle cx="94" cy="5" r="3.5" fill="#10B981" />
      <text x="104" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Worker 1-3</text>
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#059669">
      ● Zero-Downtime Rolling Delivery
    </text>
  </g>

  <!-- Gauge 3: DevSecOps Zero-Trust -->
  <g transform="translate(432, 16)">
    <rect width="196" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#64748B">
      ZERO-TRUST GOVERNANCE
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#4F46E5">
      100% Gated
    </text>
    <!-- Badges -->
    <g transform="translate(14, 68)">
      <rect width="78" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="39" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#4F46E5" text-anchor="middle">Trivy CVE</text>
      <rect x="86" width="82" height="20" rx="5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="127" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Falco Active</text>
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#4F46E5">
      ● Zero-Root Admission Policy
    </text>
  </g>

  <!-- Gauge 4: Concurrency Throughput -->
  <g transform="translate(640, 16)">
    <rect width="196" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#64748B">
      NETWORK CONCURRENCY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#0F172A">
      10,000+ Conn
    </text>
    <!-- Progress Bar -->
    <g transform="translate(14, 72)">
      <rect width="168" height="8" rx="4" fill="#E2E8F0" />
      <rect width="156" height="8" rx="4" fill="url(#connProgressGradLight)" />
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#2563EB">
      ● epoll Reactor p99 &lt; 5ms
    </text>
  </g>
</svg>
