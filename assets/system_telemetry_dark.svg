<svg width="850" height="160" viewBox="0 0 850 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Apple Space Gray & GitHub Canvas) -->
    <linearGradient id="telemetryBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Sparkline Gradient Fill Dark -->
    <linearGradient id="sparklineGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Progress Bar Gradient Dark -->
    <linearGradient id="connProgressGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#79B8FF" />
    </linearGradient>
  </defs>

  <!-- Container Surface -->
  <rect x="2" y="2" width="846" height="156" rx="16" fill="url(#telemetryBgDark)" stroke="#30363D" stroke-width="1.2" />

  <!-- Gauge 1: Kernel Hook Latency -->
  <g transform="translate(16, 16)">
    <rect width="196" height="126" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#8B949E">
      KERNEL HOOK LATENCY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#58A6FF">
      &lt; 1.2 μs
    </text>
    <!-- Sparkline Graphic -->
    <path d="M14 78 Q 30 66, 50 74 T 90 70 T 130 76 T 160 68 T 182 72 L 182 86 L 14 86 Z" fill="url(#sparklineGradDark)" />
    <path d="M14 78 Q 30 66, 50 74 T 90 70 T 130 76 T 160 68 T 182 72" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" />
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#3FB950">
      ● Target &lt; 5.0 μs (100% In-Budget)
    </text>
  </g>

  <!-- Gauge 2: Cluster Availability -->
  <g transform="translate(224, 16)">
    <rect width="196" height="126" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#8B949E">
      CLUSTER AVAILABILITY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#3FB950">
      99.9% SLA
    </text>
    <!-- Node Status Indicators -->
    <g transform="translate(14, 72)">
      <circle cx="4" cy="5" r="3.5" fill="#3FB950" />
      <text x="14" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#C9D1D9">CP-01 (Tart)</text>
      <circle cx="94" cy="5" r="3.5" fill="#3FB950" />
      <text x="104" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#C9D1D9">Worker 1-3</text>
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#3FB950">
      ● Zero-Downtime Rolling Delivery
    </text>
  </g>

  <!-- Gauge 3: DevSecOps Zero-Trust -->
  <g transform="translate(432, 16)">
    <rect width="196" height="126" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#8B949E">
      ZERO-TRUST GOVERNANCE
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#A78BFA">
      100% Gated
    </text>
    <!-- Badges -->
    <g transform="translate(14, 68)">
      <rect width="78" height="20" rx="5" fill="#1E1B4B" stroke="#3730A3" stroke-width="1" />
      <text x="39" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#A78BFA" text-anchor="middle">Trivy CVE</text>
      <rect x="86" width="82" height="20" rx="5" fill="#142D1E" stroke="#238636" stroke-width="1" />
      <text x="127" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#3FB950" text-anchor="middle">Falco Active</text>
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#A78BFA">
      ● Zero-Root Admission Policy
    </text>
  </g>

  <!-- Gauge 4: Concurrency Throughput -->
  <g transform="translate(640, 16)">
    <rect width="196" height="126" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#8B949E">
      NETWORK CONCURRENCY
    </text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#F0F6FC">
      10,000+ Conn
    </text>
    <!-- Progress Bar -->
    <g transform="translate(14, 72)">
      <rect width="168" height="8" rx="4" fill="#30363D" />
      <rect width="156" height="8" rx="4" fill="url(#connProgressGradDark)" />
    </g>
    <!-- Footer SLA -->
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600" fill="#58A6FF">
      ● epoll Reactor p99 &lt; 5ms
    </text>
  </g>
</svg>
