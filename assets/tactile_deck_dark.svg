<svg width="850" height="135" viewBox="0 0 850 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Key Drop Shadow Dark -->
    <filter id="keyBevelShadowDark" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Key Top Cap Gradient Dark -->
    <linearGradient id="keyTopDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262D" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Key Top Cap Highlighted Dark (Command) -->
    <linearGradient id="keyTopBlueDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <style>
      @keyframes tactilePressDark {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(2.5px); }
      }
      .kd-esc { animation: tactilePressDark 3.6s ease-in-out infinite 0.0s; }
      .kd-tab { animation: tactilePressDark 3.6s ease-in-out infinite 0.6s; }
      .kd-cmd { animation: tactilePressDark 3.6s ease-in-out infinite 1.2s; }
      .kd-opt { animation: tactilePressDark 3.6s ease-in-out infinite 1.8s; }
      .kd-shf { animation: tactilePressDark 3.6s ease-in-out infinite 2.4s; }
      .kd-ret { animation: tactilePressDark 3.6s ease-in-out infinite 3.0s; }
    </style>
  </defs>

  <!-- Deck Enclosure Frame Dark -->
  <rect x="2" y="2" width="846" height="131" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.2" />

  <!-- Deck Sub-Header & Metadata -->
  <g transform="translate(24, 20)">
    <circle cx="4" cy="5" r="3.5" fill="#58A6FF" />
    <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#58A6FF">
      TACTICAL COMMAND DECK · SHORTCUT ARCHITECTURE
    </text>
    <text x="798" y="9" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#8B949E" text-anchor="end">
      APPLE HIG TACTILE SWITCH · 60g ACTUATION
    </text>
  </g>

  <!-- Key 1: ⎋ ESC (Kernel 6.x) -->
  <g class="kd-esc" transform="translate(15, 46)" filter="url(#keyBevelShadowDark)">
    <!-- Base Chamfer -->
    <rect width="125" height="66" rx="12" fill="#30363D" />
    <!-- Top Cap -->
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopDark)" stroke="#374151" stroke-width="1" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#F0F6FC">⎋ ESC</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#58A6FF">Kernel 6.x</text>
  </g>

  <!-- Key 2: ⇥ TAB (eBPF / libbpf) -->
  <g class="kd-tab" transform="translate(154, 46)" filter="url(#keyBevelShadowDark)">
    <rect width="125" height="66" rx="12" fill="#30363D" />
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopDark)" stroke="#374151" stroke-width="1" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#F0F6FC">⇥ TAB</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#3FB950">eBPF · libbpf</text>
  </g>

  <!-- Key 3: ⌘ K (K8s Clusters) - Highlighted Signature Key -->
  <g class="kd-cmd" transform="translate(293, 46)" filter="url(#keyBevelShadowDark)">
    <rect width="125" height="66" rx="12" fill="#1D4ED8" />
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopBlueDark)" stroke="#388BFD" stroke-width="1.2" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#93C5FD">⌘ + K</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="800" fill="#79B8FF">K8s Clusters</text>
  </g>

  <!-- Key 4: ⌥ T (Terraform IaC) -->
  <g class="kd-opt" transform="translate(432, 46)" filter="url(#keyBevelShadowDark)">
    <rect width="125" height="66" rx="12" fill="#30363D" />
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopDark)" stroke="#374151" stroke-width="1" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#F0F6FC">⌥ + T</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#A78BFA">Terraform IaC</text>
  </g>

  <!-- Key 5: ⇧ A (ArgoCD GitOps) -->
  <g class="kd-shf" transform="translate(571, 46)" filter="url(#keyBevelShadowDark)">
    <rect width="125" height="66" rx="12" fill="#30363D" />
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopDark)" stroke="#374151" stroke-width="1" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#F0F6FC">⇧ + A</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#FBBF24">ArgoCD GitOps</text>
  </g>

  <!-- Key 6: ↩ RET (epoll WAS) -->
  <g class="kd-ret" transform="translate(710, 46)" filter="url(#keyBevelShadowDark)">
    <rect width="125" height="66" rx="12" fill="#30363D" />
    <rect x="1.5" y="1.5" width="122" height="60" rx="10" fill="url(#keyTopDark)" stroke="#374151" stroke-width="1" />
    <text x="12" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#F0F6FC">↩ RETURN</text>
    <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#F87171">epoll WAS</text>
  </g>
</svg>
